# Aerospace tiling window manager
# https://nikitabobko.github.io/AeroSpace/guide

# Config version for compatibility and deprecations
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# This config version is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
# Each persistent workspace has one job:
#   1 Terminal  2 Browser  3 Chat  4 Plan  5 Create
# 6-8 still work on demand (6 is for games), but prev/next skips them when empty.
persistent-workspaces = ["1", "2", "3", "4", "5"]

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
# The MacBook's built-in screen keeps tight gaps. External screens get room
# to show the wallpaper; the ultrawide gets wide sides so a lone window
# stays centered and readable. The first matching monitor pattern wins.
[gaps]
    inner.horizontal = [{ monitor.'built-in' = 12 }, 20]
    inner.vertical =   [{ monitor.'built-in' = 12 }, 20]
    outer.left =       [{ monitor.'built-in' = 12 }, { monitor.'S34J55x' = 320 }, 48]
    outer.right =      [{ monitor.'built-in' = 12 }, { monitor.'S34J55x' = 320 }, 48]
    outer.top =        [{ monitor.'built-in' = 12 }, 24]
    outer.bottom =     [{ monitor.'built-in' = 12 }, 24]

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e '
    # tell application "Terminal"
    #     do script
    #     activate
    # end tell'
    # '''
    cmd-alt-enter = 'exec-and-forget open -a WezTerm'
    cmd-alt-c = ['workspace 4', 'exec-and-forget open -a "Calendar"']

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    # alt-slash = 'layout tiles horizontal vertical'
    # alt-comma = 'layout accordion horizontal vertical'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    cmd-alt-h = 'focus left'
    cmd-alt-j = 'focus down'
    cmd-alt-k = 'focus up'
    cmd-alt-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    cmd-alt-shift-h = 'move left'
    cmd-alt-shift-j = 'move down'
    cmd-alt-shift-k = 'move up'
    cmd-alt-shift-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    cmd-alt-minus = 'resize smart -50'
    cmd-alt-equal = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    cmd-alt-1 = 'workspace 1'
    cmd-alt-2 = 'workspace 2'
    cmd-alt-3 = 'workspace 3'
    cmd-alt-4 = 'workspace 4'
    cmd-alt-5 = 'workspace 5'
    cmd-alt-6 = 'workspace 6'
    cmd-alt-7 = 'workspace 7'
    cmd-alt-8 = 'workspace 8'

    # Same workspaces 1-5 for the right hand, for keyboards without
    # right-side cmd and alt: left hand holds cmd-alt, right hand picks.
    cmd-alt-n = 'workspace 1'
    cmd-alt-m = 'workspace 2'
    cmd-alt-comma = 'workspace 3'
    cmd-alt-period = 'workspace 4'
    cmd-alt-slash = 'workspace 5'

    cmd-alt-left = 'workspace prev'
    cmd-alt-right = 'workspace next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    cmd-alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
    cmd-alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
    cmd-alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
    cmd-alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
    cmd-alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
    cmd-alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
    cmd-alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
    cmd-alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']

    # Right-hand versions of cmd-alt-shift-1 to 5
    cmd-alt-shift-n = ['move-node-to-workspace 1', 'workspace 1']
    cmd-alt-shift-m = ['move-node-to-workspace 2', 'workspace 2']
    cmd-alt-shift-comma = ['move-node-to-workspace 3', 'workspace 3']
    cmd-alt-shift-period = ['move-node-to-workspace 4', 'workspace 4']
    cmd-alt-shift-slash = ['move-node-to-workspace 5', 'workspace 5']

    cmd-alt-shift-left = ['move-node-to-workspace prev', 'workspace prev']
    cmd-alt-shift-right = ['move-node-to-workspace next', 'workspace next']

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    cmd-alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    cmd-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    cmd-alt-shift-semicolon = 'mode service'

    # Toggle fullscreen
    cmd-alt-z = 'fullscreen'

    # Toggle float and center
    cmd-alt-t = 'layout floating tiling'

    # Toggle/cycle floating windows
    cmd-alt-f = 'exec-and-forget ~/Developer/scripts/aerospace_focus_floating.sh'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    cmd-alt-shift-h = ['join-with left', 'mode main']
    cmd-alt-shift-j = ['join-with down', 'mode main']
    cmd-alt-shift-k = ['join-with up', 'mode main']
    cmd-alt-shift-l = ['join-with right', 'mode main']

# For second monitor
# Workspaces 1-6 always on main, 7-8 on secondary (fallback to main when disconnected)
[workspace-to-monitor-force-assignment]
    1 = 'main'
    2 = 'main'
    3 = 'main'
    4 = 'main'
    5 = 'main'
    6 = 'main'
    7 = ['secondary', 'main']
    8 = ['secondary', 'main']

# Dedicated workspaces per app type
# Terminal (1) and browser (2) are less restricted
# See: https://nikitabobko.github.io/AeroSpace/guide#on-window-detected-callback

# 3 Chat
[[on-window-detected]]
    if.app-id = 'com.apple.MobileSMS'
    run = 'move-node-to-workspace 3'
[[on-window-detected]]
    if.app-id = 'com.hnc.Discord'
    run = 'move-node-to-workspace 3'
[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'
    run = 'move-node-to-workspace 3'
[[on-window-detected]]
    if.app-id = 'ru.keepcoder.Telegram'
    run = 'move-node-to-workspace 3'
[[on-window-detected]]
    if.app-id = 'net.whatsapp.WhatsApp'
    run = 'move-node-to-workspace 3'
[[on-window-detected]]
    if.app-id = 'com.apple.mail'
    run = 'move-node-to-workspace 3'

# 4 Plan
[[on-window-detected]]
    if.app-id = 'com.apple.iCal'
    run = 'move-node-to-workspace 4'
[[on-window-detected]]
    if.app-id = 'com.apple.Notes'
    run = 'move-node-to-workspace 4'
[[on-window-detected]]
    if.app-id = 'com.apple.reminders'
    run = 'move-node-to-workspace 4'

# 5 Create
[[on-window-detected]]
    if.app-id = 'com.apple.logic10'
    run = 'move-node-to-workspace 5'
[[on-window-detected]]
    if.app-id = 'com.ableton.live'
    run = 'move-node-to-workspace 5'
[[on-window-detected]]
    if.app-id = 'com.splice.Splice'
    run = 'move-node-to-workspace 5'
[[on-window-detected]]
    if.app-id = 'com.uaudio.ua-connect'
    run = 'move-node-to-workspace 5'
[[on-window-detected]]
    if.app-id = 'com.canva.affinity'
    run = 'move-node-to-workspace 5'

# Float overrides
[[on-window-detected]]
    if.app-id = 'us.zoom.xos'
    run = 'layout floating'
[[on-window-detected]]
    if.app-id = 'com.apple.FaceTime'
    run = 'layout floating'
[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'
[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'layout floating'
[[on-window-detected]]
    if.app-id = 'com.apple.Passwords'
    run = 'layout floating'
