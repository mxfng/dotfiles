set -g default-terminal "tmux-256color"
set -g terminal-overrides "wezterm*:RGB"

# Truecolor and terminal capabilities. Escape is \E in these strings: tmux
# sends a lowercase \e as the two characters \ and e, not as an escape.
set -as terminal-overrides ',*:Tc'                        # True color support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'        # Underline styles
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'   # Cursor shape
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'  # Clipboard (OSC 52)
set -as terminal-overrides ',*:Cs=\E]12;%p1%s\007'        # Cursor color
set -as terminal-overrides ',*:Cr=\E]112\007'             # Reset cursor color
set -as terminal-overrides ',*:Cc=\E]12;%p1%s\007'        # Change cursor color
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # Underline colors

# No DECSLRM margins: tmux enables them for WezTerm, whose handling leaves
# side-by-side panes half-painted (lines cut at a fixed column). Without the
# caps tmux clears its margins flag and redraws pane lines instead.
set -as terminal-overrides ',*:Cmg@:Clmg@:Enmg@:Dsmg@'

# Start window/pane indexing at 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Status bar refresh interval
set -g status-interval 5

# Focus events (useful for vim/neovim)
set -g focus-events on

# Aggressive resize (useful when multiple clients)
setw -g aggressive-resize on

# Reduce escape time (better for vim/neovim)
set -g escape-time 50

# Enable mouse support
setw -g mouse on
bind -T copy-mode-vi WheelUpPane send-keys -N 2 -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -N 2 -X scroll-down

# Use vi-style key bindings in copy mode
setw -g mode-keys vi

# Change prefix from C-b to C-a (easier to reach)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Navigate panes with vim-style keys (after the prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ctrl-h/j/k/l without the prefix. When the pane runs Neovim (or fzf), pass
# the key through so Neovim can move between its own splits first; the
# vim-tmux-navigator plugin in Neovim hands off to tmux at the edge.
# From https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Split panes with | and _ (more intuitive visual representation)
# Open new panes in current directory
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# Also keep default bindings with current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# New windows open in current directory
bind c new-window -c "#{pane_current_path}"

# Toggle a Claude Code pane on the right (one per window, kept alive when hidden).
# It keeps its width when the window resizes, remembers a width you drag
# to (saved once, when the drag ends), and hidden Claudes whose window is
# gone are killed.
bind a run-shell "~/.config/tmux/claude-toggle toggle '#{pane_id}'"
bind -T root MouseDragEnd1Border run-shell "~/.config/tmux/claude-toggle save '#{window_id}'"
set-hook -g window-resized 'run-shell -b "~/.config/tmux/claude-toggle fit #{hook_window}"'
set-hook -g window-unlinked 'run-shell -b "~/.config/tmux/claude-toggle gc"'

# Swap panes with vim-style keys
bind -r H swap-pane -U
bind -r J swap-pane -D
bind -r K swap-pane -U
bind -r L swap-pane -D

# Resize panes with vim-style keys (repeatable with -r)
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# TPM (Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'

# Status bar. ANSI color names follow the active `theme`.
set -g status-style 'bg=default'
set -g status-left '#[fg=magenta,bold] #S '
set -g status-right-length 100
set -g status-right '#[fg=cyan]#{pane_current_command}  #[fg=blue]#{b:pane_current_path}  #[fg=yellow]#(whoami)@#h '
set -g window-status-format '#[fg=brightblack] #I #W '
set -g window-status-current-format '#[fg=magenta,bold] #I #W '
set -g pane-active-border-style 'fg=magenta'

# Initialize TPM (keep this at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
